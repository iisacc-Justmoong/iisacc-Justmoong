name: Update language chart

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_languages.py'
      - 'tests/**'
      - '.github/workflows/languages.yml'
  pull_request:
    paths:
      - 'scripts/update_languages.py'
      - 'tests/**'
      - '.github/workflows/languages.yml'

permissions:
  contents: read

concurrency:
  group: language-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Generate chart from public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_languages.py
      - name: Commit changed chart
        run: |
          git add assets/languages.json assets/languages-light.svg assets/languages-dark.svg
          if git diff --cached --quiet; then
            echo "Language statistics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public language statistics"
          git push origin HEAD:main
